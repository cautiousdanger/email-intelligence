map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  listen [::]:80;
  server_name 172.16.200.30;

  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name 172.16.200.30;

  ssl_certificate /etc/nginx/certs/dashboard.pem;
  ssl_certificate_key /etc/nginx/certs/dashboard-key.pem;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_protocols TLSv1.2 TLSv1.3;
  proxy_buffer_size 128k;
  proxy_buffers 8 128k;
  proxy_busy_buffers_size 256k;

  client_max_body_size 25m;

  # Re-resolve Docker service names when upstream containers are recreated (avoids stale 502s).
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /backend/ {
    set $backend_upstream http://email-intelligence-api:8000;
    rewrite ^/backend/(.*)$ /$1 break;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    # Daily digest + Ollama summary calls can exceed 60s; avoid 504 Gateway Timeout.
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
  }

  location / {
    set $dashboard_upstream http://dashboard:3001;
    proxy_pass $dashboard_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
